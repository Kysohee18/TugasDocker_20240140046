<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Deployment Task</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
    <h2 class="text-3xl font-bold text-slate-800 mb-6 text-center">Login Page</h2>

    <form th:action="@{/login}" method="post" class="space-y-4">
        <div th:if="${error}" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4" th:text="${error}"></div>

        <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition duration-300 shadow-lg shadow-blue-200">
            Login
        </button>
    </form>
</div>
</body>
</html>
