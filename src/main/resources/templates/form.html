<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Input Mahasiswa - Tugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
<div class="bg-white w-full max-w-2xl rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-blue-600 p-6 text-white text-center">
        <h2 class="text-2xl font-bold">Form Input Mahasiswa</h2>
        <p class="text-blue-100 text-sm opacity-80">Silakan lengkapi data mahasiswa di bawah ini.</p>
    </div>

    <form th:action="@{/save}" th:object="${user}" method="post" class="p-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-sm font-bold text-slate-700">Nama Lengkap</label>
                <input type="text" th:field="*{nama}" placeholder="Contoh: Shahky Yandhana" required
                       class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
            <div class="space-y-2">
                <label class="text-sm font-bold text-slate-700">Nomor Induk Mahasiswa (NIM)</label>
                <input type="text" th:field="*{nim}" placeholder="2024014XXXX" required
                       class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>
        </div>

        <div class="space-y-3">
            <label class="text-sm font-bold text-slate-700 block">Jenis Kelamin</label>
            <div class="flex space-x-6">
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" th:field="*{jenisKelamin}" value="Laki-laki" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                    <span class="text-slate-600 group-hover:text-blue-600 transition">Laki-laki</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input type="radio" th:field="*{jenisKelamin}" value="Perempuan" class="w-4 h-4 text-pink-600 focus:ring-pink-500">
                    <span class="text-slate-600 group-hover:text-pink-600 transition">Perempuan</span>
                </label>
            </div>
        </div>

        <div class="pt-6 border-t border-slate-100 flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4">
            <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-100">
                Simpan Data
            </button>
            <a th:href="@{/home}" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-center transition">
                Kembali ke Home
            </a>
        </div>
    </form>
</div>
</body>
</html>
